CPU_LOAD_WARN=2.0
MEMORY_WARN_PERCENT=80
DISK_WARN_PERCENT=80

PROJECT_DIR="$HOME/linux-server-monitor"
LOG_DIR="$PROJECT_DIR/logs"
#Service Recovery
MONITORED_SERVICE="linux-monitor-demo.service"
MAX_RESTART_ATTEMPTS=2
RESTART_COOLDOWN_SECONDS=5

#BACKUP AND RESTORE
BACKUP_DIR="$PROJECT_DIR/backups"
BACKUP_SOURCE="$PROJECT_DIR/sample-data"
